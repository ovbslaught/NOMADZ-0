name: MOTHER-BRAIN Resilient Sync — GitHub <-> Google Drive Wormhole

on:
  push:
    branches: [ "main", "Cosmic-key" ]
  workflow_dispatch:

jobs:
  sync-mother-brain:
    name: Rclone WORMHOLE Substrate Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rclone
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      - name: Validate & Setup Rclone Configuration
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [ -z "$RCLONE_CONF_DATA" ]; then
            echo "WARNING: RCLONE_CONFIG secret is not configured on this repository."
            exit 1
          fi
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF_DATA" > ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: Execute Guarded Two-Way Sync
        run: |
          rclone copy . gdrive:WORMHOLE/MOTHER-BRAIN/ \
            --exclude ".git/**" \
            --exclude "*.tmp" \
            --fast-list \
            --transfers 4 \
            --checkers 8 \
            -v
