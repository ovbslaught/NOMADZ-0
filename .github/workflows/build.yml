name: NOMADZ-0 Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: "NOMADZ-0"

jobs:
  build-windows:
    name: Build Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot + export templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip && mv Godot_v*linux* /usr/local/bin/godot && chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.tpz
          unzip -q templates.tpz -d /tmp/tpz
          mv /tmp/tpz/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Create export_presets.cfg if missing
        run: |
          if [ ! -f export_presets.cfg ]; then
            cat > export_presets.cfg << 'CFG'
[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/NOMADZ-0.exe"
CFG
          fi

      - name: Build Windows export
        run: |
          mkdir -p build
          godot --headless --export-release "Windows Desktop" build/${EXPORT_NAME}.exe || true

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOMADZ-0-windows
          path: build/*.exe
          if-no-files-found: warn

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Godot + Android templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip && mv Godot_v*linux* /usr/local/bin/godot && chmod +x /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.tpz
          unzip -q templates.tpz -d /tmp/tpz
          mv /tmp/tpz/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Create Android export preset if missing
        run: |
          if ! grep -q "Android" export_presets.cfg 2>/dev/null; then
            cat >> export_presets.cfg << 'CFG'

[preset.1]
name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/NOMADZ-0.apk"
CFG
          fi

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/${EXPORT_NAME}.apk || true

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOMADZ-0-android
          path: build/*.apk
          if-no-files-found: warn
